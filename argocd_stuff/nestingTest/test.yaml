apiVersion: apps/v1
kind: Deployment
metadata:
  name: nesting-test
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nesting-test1
  template:
    metadata:
      labels:
        app: nesting-test1
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netsing-test1
  namespace: test
spec:
  selector:
    app: nesting-test1
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nesting-test1
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`whoami1.andreiboghean.com`) && Path(`/__header-test`)
      priority: 1000
      services:
        - name: header-test
          port: 80
  tls:
    certResolver: default



---
