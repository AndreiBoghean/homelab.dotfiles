apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackarr-qbittorrent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/gabe565/charts/qbittorrent
    targetRevision: 0.4.1
    chart: qbittorrent
    helm:
      valuesObject:
        persistence:
          config:
            enabled: true
            size: 8Gi
            storageClass: 'stackarr-qbittorrent-manual'
          downloads:
            enabled: true
            size: 128Gi
            storageClass: 'stackarr-qbittorrent-manual'
            accessMode: ReadWriteOnce
          
  destination:
    server: https://kubernetes.default.svc   
    namespace: stackarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stackarr-qbittorrent-ingress
  namespace: stackarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`qbittorrent.andreiboghean.com`)
      services:
        - name: stackarr-qbittorrent
          port: 8080
  tls:
    certResolver: default

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: stackarr-qbittorrent-config
spec:
  storageClassName: stackarr-qbittorrent-manual
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/kubePVs/stackarr/qbittorrent
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nixos-server

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: stackarr-qbittorrent-downloads
spec:
  storageClassName: stackarr-qbittorrent-manual
  capacity:
    storage: 128Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/kubePVs/stackarr/ingestable-tents
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nixos-server
