# ########################################################## MAIN APP
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://zekker6.github.io/helm-charts/
    targetRevision: 8.35.0
    chart: homer
    helm:
      valuesObject:
        configmap:
          config:
            enabled: true
            data:
              config.yml: |-
                title: "SERVERERERERERER OVERVIEW!! :D"
                subtitle: "Homer"
                logo: "logo.png"
                # icon: "fas fa-skull-crossbones" # Optional icon

                header: true
                footer: '<p>Created with <span class="has-text-danger">❤️</span> with <a href="https://bulma.io/">bulma</a>, <a href="https://vuejs.org/">vuejs</a> & <a href="https://fontawesome.com/">font awesome</a> // Fork me on <a href="https://github.com/bastienwirtz/homer"><i class="fab fa-github-alt"></i></a></p>' # set false if you want to hide it.

                # Optional theme customization
                theme: default

                # Optional theme customization (color overrrides)
                # overrrides can also be done using CSS vars 
                colors:
                  light:
                    highlight-primary: "#3367d6"
                    highlight-secondary: "#4285f4"
                    highlight-hover: "#5a95f5"
                    background: "#f5f5f5"
                    card-background: "#ffffff"
                    text: "#363636"
                    text-header: "#ffffff"
                    text-title: "#303030"
                    text-subtitle: "#424242"
                    card-shadow: rgba(0, 0, 0, 0.1)
                    link: "#3273dc"
                    link-hover: "#363636"
                  dark:
                    highlight-primary: "#3367d6"
                    highlight-secondary: "#4285f4"
                    highlight-hover: "#5a95f5"
                    background: "#131313"
                    card-background: "#2b2b2b"
                    text: "#eaeaea"
                    text-header: "#ffffff"
                    text-title: "#fafafa"
                    text-subtitle: "#f5f5f5"
                    card-shadow: rgba(0, 0, 0, 0.4)
                    link: "#3273dc"
                    link-hover: "#ffdd57"

                # Optional message
                message:
                  #url: https://b4bz.io
                  style: "is-dark" # See https://bulma.io/documentation/components/message/#colors for styling options.
                  title: "work in progress !"
                  icon: "fa fa-grin"
                  content: "This is a barebones homepage. I'll make a proper personal site one day. (that's a lie.. I'll keep postponing it until next summer endlessly)<br />"

                # Optional navbar
                # links: [] # Allows for navbar (dark mode, layout, and search) without any links
                links:
                  - name: "Contribute"
                    icon: "fab fa-github"
                    url: "https://github.com/bastienwirtz/homer"
                    target: "_blank" # optional html a tag target attribute
                  - name: "Wiki"
                    icon: "fas fa-book"
                    url: "https://www.wikipedia.org/"
                  # this will link to a second homer page that will load config from additional-page.yml and keep default config values as in config.yml file
                  # see url field and assets/additional-page.yml.dist used in this example:
                  #- name: "another page!"
                  #  icon: "fas fa-file-alt"
                  #  url: "#additional-page" 

                # Services
                # First level array represent a group.
                # Leave only a "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
                services:
                  - name: "Applications/Services"
                    icon: "fas fa-cloud"
                    items:
                      # - name: "QbitTorrent"
                      #   subtitle: "you know what this is for."
                      #   url: "https://qbittorrent.andreiboghean.com"

                      # - name: "home speed test telemetry"
                      #   subtitle: "use email \"guest@guest.guest\" and pass \"guest\" to get in."
                      #   url: "https://speedtest.andreiboghean.com"

                      # - name: "trueNAS admin panel"
                      #   subtitle: "title says it all."
                      #   url: "https://trueNAS.andreiboghean.com"

                      # - name: "nginx proxy manager"
                      #   subtitle: "title says it all."
                      #   url: "https://proxyManager.andreiboghean.com"

                      - name: "nextcloud"
                        subtitle: "self-hosted google cloud alternative"
                        url: "https://nextcloud.andreiboghean.com"

                      - name: "vaultwarden"
                        subtitle: "bitwarden, but a rust implementation which is speeeed"
                        url: "https://vaultwarden.andreiboghean.com"

                  - name: "Projects"
                    icon: "fas fa-code"
                    items:
                      - name: "FreeToFly"
                        icon: ""
                        subtitle: "group hackathon project for a simple 404 page minigame"
                        url: "https://calumvc.github.io/FreeToFly"

                      - name: "(currently DEAD) minesweeper"
                        icon: ""
                        subtitle: "basic minesweeper game with backend playthrough recording for analysis as an MSci project"
                        url: "https://minesweeper.andreiboghean.com"

                      - name: "(currently DEAD) Course Configurator"
                        icon: ""
                        subtitle: "small proj generating combinations of possible timetables from selected courses"
                        url: "https://courseConfig.andreiboghean.com"

                  - name: "cool people"
                    icon: "fas fa-users"
                    items:
                      - name: "Andrei (Ghita)"
                        subtitle: "andreig.dev"
                        url: "https://andreig.dev"

                      - name: "Ben"
                        subtitle: "vyrz.dev"
                        url: "https://vyrz.dev"

                      - name: "Daniel"
                        subtitle: "sheisepic.lol"
                        url: "https://sheisepic.lol"

                      - name: "Fraser"
                        subtitle: "frasermiller.dev"
                        url: "https://frasermiller.dev"

                      - name: "Jackson"
                        subtitle: "jacksondam.com"
                        url: "https://jacksondam.com"

                      - name: "Luke"
                        subtitle: "lukeormiston.com"
                        url: "https://lukeormiston.com"

                      - name: "Mark"
                        subtitle: "mrktrnbll.dev"
                        url: "https://mrktrnbll.dev"

                      - name: "Nour"
                        subtitle: "nourelfangary.com"
                        url: "https://nourelfangary.com"


                
  destination:
    server: https://kubernetes.default.svc   
    namespace: homer
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

---
# ########################################################## INGRESS ROUTE

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homer-ingress
  namespace: homer
spec:
  entryPoints:
    - websecure
    - interwebsecure
  routes:
    - kind: Rule
      match: Host(`andreiboghean.com`)
      services:
        - name: homer
          port: 8080
  tls:
    certResolver: default
