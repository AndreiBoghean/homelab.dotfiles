apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackarr-prowlarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.pree.dev
    targetRevision: 1.60.0
    chart: prowlarr
    helm:
      valuesObject:
        persistence:
          config:
            enabled: true
            size: 8Gi
            storageClass: 'stackarr-prowlarr-manual'
          # media:
          #   enabled: true
          #   size: 3000G
          #   storageClass: 'stackarr-jellyfin-manual'
          
  destination:
    server: https://kubernetes.default.svc   
    namespace: stackarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stackarr-prowlarr-ingress
  namespace: stackarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`prowlarr.andreiboghean.com`)
      services:
        - name: stackarr-prowlarr
          port: 9696
  tls:
    certResolver: default

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: stackarr-prowlarr-config
spec:
  storageClassName: stackarr-prowlarr-manual
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/kubePVs/stackarr/prowlarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nixos-server
