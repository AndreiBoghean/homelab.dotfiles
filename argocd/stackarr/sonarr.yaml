apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackarr-sonarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.pree.dev
    targetRevision: 1.30.0
    chart: sonarr
    helm:
      valuesObject:
        persistence:
          config:
            enabled: true
            size: 8Gi
            storageClass: 'stackarr-sonarr-manual'
          media:
            enabled: true
            size: 3000G
            storageClass: 'stackarr-sonarr-manual'
            accessMode: ReadWriteOnce
          ingestabletents:
            enabled: true
            size: 128Gi
            storageClass: 'stackarr-sonarr-manual'
            accessMode: ReadWriteOnce
            mountPath: /downloads
          
  destination:
    server: https://kubernetes.default.svc   
    namespace: stackarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stackarr-sonarr-ingress
  namespace: stackarr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`sonarr.andreiboghean.com`)
      services:
        - name: stackarr-sonarr
          port: 8989
  tls:
    certResolver: default

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: stackarr-sonarr-config
spec:
  storageClassName: stackarr-sonarr-manual
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/kubePVs/stackarr/sonarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nixos-server

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: stackarr-sonarr-media-pv
spec:
  storageClassName: stackarr-sonarr-manual
  capacity:
    storage: 3000G
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/5TB_main/media"

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: stackarr-sonarr-downloads
spec:
  storageClassName: stackarr-sonarr-manual
  capacity:
    storage: 128Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/kubePVs/stackarr/ingestable-tents
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nixos-server
