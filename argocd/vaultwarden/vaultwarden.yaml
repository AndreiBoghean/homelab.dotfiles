apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gissilabs.github.io/charts/
    targetRevision: 1.4.2
    chart: vaultwarden
    helm:
      valuesObject:
        persistence:
          enabled: true
          size: 8Gi
          storageClass: vaultwarden-manual
          accessMode: ReadWriteOnce
  destination:
    server: https://kubernetes.default.svc   
    namespace: vaultwarden
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden-ingress
  namespace: vaultwarden
spec:
  entryPoints:
    - websecure
    - interwebsecure
  routes:
    - kind: Rule
      match: Host(`vaultwarden.andreiboghean.com`)
      services:
        - name: vaultwarden
          port: 80
  tls:
    certResolver: default

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden-config
spec:
  storageClassName: vaultwarden-manual
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /mnt/kubePVs/vaultwarden
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nixos-server
